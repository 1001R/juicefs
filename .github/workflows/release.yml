name: release

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

jobs:
  releaser:
    runs-on: ubuntu-22.04
    steps:
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: "1.25.0"

      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Build
        run: make juicefs.lite

      - name: Package
        run: |
          set -e
          archive="juicefs-${GITHUB_REF_NAME#v}-linux-amd64.tar.gz"
          mkdir dist
          cp juicefs.lite dist/juicefs
          tar -C dist -czf "$archive" juicefs
          sha256sum "$archive" > checksums.txt
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ env.ARCHIVE }}
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
